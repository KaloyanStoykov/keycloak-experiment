# Keycloak + Postgres for local development.
#
# Two containers:
#   postgres  - Keycloak's persistent store. Without it, every restart wipes
#               your realm, users and sessions (the default dev-mode database
#               is an in-memory H2).
#   keycloak  - the identity provider itself.
#
# Start:  docker compose up -d
# Logs:   docker compose logs -f keycloak
# Reset:  docker compose down -v     (the -v drops the volume = full wipe)

services:
  postgres:
    image: postgres:16-alpine
    container_name: kc-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak-db-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Keycloak starts faster than Postgres accepts connections, so we gate
    # startup on this healthcheck rather than letting Keycloak crash-loop.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: kc-server
    # "start-dev" = HTTP allowed, no hostname strictness, dev-friendly caching.
    # NEVER in production - see docs/06-containerizing-keycloak.md for the
    # production "start" command and what changes.
    #
    # --import-realm reads every *.json in /opt/keycloak/data/import on boot.
    # It only imports if the realm does not already exist, so editing the JSON
    # and restarting does NOT re-apply changes. You must `down -v` first.
    command: ["start-dev", "--import-realm"]
    environment:
      # --- Admin user for the console at http://localhost:8080/admin ---
      # KC_BOOTSTRAP_ADMIN_* replaced KEYCLOAK_ADMIN_* in Keycloak 26.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # --- Database ---
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-db-password

      # --- HTTP / hostname ---
      # KC_HOSTNAME must match the URL the BROWSER uses, because it ends up
      # inside the `iss` (issuer) claim of every token. Mismatch here is the
      # single most common Keycloak-in-Docker failure.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"

      # Exposes /health/* and /metrics endpoints.
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Mounted read-only: the container should never rewrite our source of truth.
      - ./keycloak/realm-dotnet-lab.json:/opt/keycloak/data/import/realm-dotnet-lab.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    # The image has no curl/wget, but it does ship a JDK, so we probe the
    # management port with a tiny Java one-liner.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
